<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>従業員情報確認</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: #f5f5f5;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;
      color: #444;
    }

    /* ページ全体 */
    .page {
      width: 100%;
      max-width: 650px;
      margin: 40px auto;
    }

    /* タイトル */
    h1 {
      margin: 0 0 30px;
      color: #00b84f;
      font-size: 30px;
      font-weight: 700;
      text-align: center;
    }

    /* カード */
    .container {
      width: 100%;
      background-color: #ffffff;
      border-top: 5px solid #00c853;
      border-radius: 12px;
      padding: 30px;
      margin-bottom: 24px;

      box-shadow:
        0 3px 8px rgba(0, 0, 0, 0.12);
    }

    /* カードタイトル */
    .form-title {
      margin: 0 0 25px;
      color: #00b84f;
      font-size: 20px;
      font-weight: 700;
    }

    /* 入力項目 */
    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #444;
      font-size: 15px;
      font-weight: 600;
    }

    .required {
      display: inline-block;
      margin-left: 6px;
      color: #e74c3c;
      font-size: 12px;
      font-weight: 600;
    }

    /* 入力欄 */
    input {
      width: 100%;
      height: 48px;
      padding: 10px 12px;
      border: 1px solid #cccccc;
      border-radius: 6px;
      background-color: #ffffff;
      color: #333;
      font-size: 16px;
      outline: none;

      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }

    input:focus {
      border-color: #00c853;

      box-shadow:
        0 0 0 2px rgba(0, 200, 83, 0.12);
    }

    /* 確認ボタン */
    button {
      width: 100%;
      height: 50px;
      margin-top: 4px;
      border: none;
      border-radius: 6px;
      background-color: #00b84f;
      color: #ffffff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;

      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #009f45;
    }

    button:active {
      background-color: #00883b;
    }

    button:disabled {
      background-color: #aaaaaa;
      cursor: default;
    }

    /* 結果表示 */
    #message {
      margin-top: 22px;
      padding: 14px;
      border-radius: 6px;
      font-size: 16px;
      line-height: 1.6;
    }

    #message:empty {
      display: none;
    }

    .success {
      display: block;
      color: #00883b;
      background-color: #f0f8f3;
      border-left: 4px solid #00b84f;
    }

    .error {
      display: block;
      color: #d93025;
      background-color: #fff3f3;
      border-left: 4px solid #d93025;
    }

    /* スマートフォン */
    @media (max-width: 600px) {

      body {
        padding: 12px;
      }

      .page {
        margin: 20px auto;
      }

      h1 {
        font-size: 25px;
      }

      .container {
        padding: 24px 18px;
        margin-bottom: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <h1>従業員情報確認</h1>

    <div class="container">

      <div class="form-title">
        従業員検索
      </div>

      <div class="form-group">

        <label for="employeeNo">
          従業員番号
          <span class="required">必須</span>
        </label>

        <input
          type="text"
          id="employeeNo"
          placeholder="従業員番号を入力して下さい"
          autocomplete="off"
        >

      </div>

      <button
        type="button"
        id="searchButton"
        onclick="sendEmployeeNo()"
      >
        確認する
      </button>

      <div id="message"></div>

    </div>

  </div>


  <script>

    const FLOW_URL =
      "https://default1a2cf14ad33440fe9e6c8e9728b84d.0d.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/23/workflows/b693c735e232429d960ea490697bd2e4/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=GAz4kHywGHHs_xlSci1Zst9WtPy3F5zSdKd9oVM6riA";


    async function sendEmployeeNo() {

      const employeeNo =
        document
          .getElementById("employeeNo")
          .value
          .trim();

      const button =
        document.getElementById("searchButton");

      const message =
        document.getElementById("message");


      message.textContent = "";
      message.className = "";


      if (!employeeNo) {

        message.textContent =
          "従業員番号を入力して下さい。";

        message.className = "error";

        return;
      }


      button.disabled = true;

      button.textContent =
        "確認中です...";


      try {

        const response =
          await fetch(
            FLOW_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                employeeNo: employeeNo
              })
            }
          );


        if (!response.ok) {

          throw new Error(
            "HTTP " + response.status
          );

        }


        const data =
          await response.json();


        if (!data.name) {

          message.textContent =
            "該当する従業員が見つかりませんでした。";

          message.className =
            "error";

          return;
        }


        message.innerHTML =
  "所属ブロック：<strong>" + data.block + "</strong><br>" +
  "所属SS：<strong>" + data.ss + "</strong><br>" +
  "氏名：<strong>" + data.name + "</strong>";

        message.className =
          "success";


      } catch (error) {

        console.error(error);

        message.textContent =
          "従業員情報の取得に失敗しました。";

        message.className =
          "error";


      } finally {

        button.disabled = false;

        button.textContent =
          "確認する";

      }

    }


    /* Enterキーでも確認 */
    document
      .getElementById("employeeNo")
      .addEventListener(
        "keydown",
        function (event) {

          if (event.key === "Enter") {
            sendEmployeeNo();
          }

        }
      );

  </script>

</body>

</html>
