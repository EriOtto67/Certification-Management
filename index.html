<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>従業員情報確認</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: #f5f5f5;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;
      color: #444;
    }

    /* ページ全体 */
    .page {
      width: 100%;
      max-width: 650px;
      margin: 40px auto;
    }

    /* タイトル */
    h1 {
      margin: 0 0 30px;
      color: #00b84f;
      font-size: 30px;
      font-weight: 700;
      text-align: center;
    }

    /* カード */
    .container {
      width: 100%;
      background-color: #ffffff;
      border-top: 5px solid #00c853;
      border-radius: 12px;
      padding: 30px;
      margin-bottom: 24px;

      box-shadow:
        0 3px 8px rgba(0, 0, 0, 0.12);
    }

    /* カードタイトル */
    .form-title {
      margin: 0 0 25px;
      color: #00b84f;
      font-size: 20px;
      font-weight: 700;
    }

    /* 資格情報更新画面の小見出し */
#licenseGetFields > .form-title,
#licenseUpdateFields > .form-title,
#otherQualificationFields > .form-title {
  margin-top: 28px;
  padding-top: 20px;
  border-top: 2px solid #00c853;
}

    /* 報告内容選択の区切り線 */
#reportSelect > .form-title {
  padding-top: 20px;
  border-top: 2px solid #00c853;
}

    /* 入力項目 */
    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #444;
      font-size: 15px;
      font-weight: 600;
    }

    .required {
      display: inline-block;
      margin-left: 6px;
      color: #e74c3c;
      font-size: 12px;
      font-weight: 600;
    }

    /* 入力欄 */
    input {
      width: 100%;
      height: 48px;
      padding: 10px 12px;
      border: 1px solid #cccccc;
      border-radius: 6px;
      background-color: #ffffff;
      color: #333;
      font-size: 16px;
      outline: none;

      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }

    /* 日付入力欄のスマホはみ出し防止 */
input[type="date"] {
  display: block;
  width: 100%;
  max-width: 100%;
  min-width: 0;
  -webkit-appearance: none;
  appearance: none;
}

    /* 日付入力の案内表示 */
.date-input-wrap {
  position: relative;
  width: 100%;
}

.date-input-wrap input[type="date"] {
  color: transparent;
}

.date-input-wrap .date-placeholder {
  position: absolute;
  top: 50%;
  left: 12px;
  transform: translateY(-50%);
  color: #888888;
  font-size: 16px;
  pointer-events: none;
}

.date-input-wrap.has-value input[type="date"] {
  color: #333333;
}

.date-input-wrap.has-value .date-placeholder {
  display: none;
}

    input:focus {
      border-color: #00c853;

      box-shadow:
        0 0 0 2px rgba(0, 200, 83, 0.12);
    }

    /* ラジオボタン */
input[type="radio"] {
  width: 18px;
  height: 18px;
  margin: 0 8px 0 0;
  padding: 0;
  accent-color: #00b84f;
  vertical-align: middle;
  box-shadow: none;
}

    #licenseGetFields label:has(input[type="radio"]) {
  display: flex;
  align-items: center;
  min-height: 42px;
  margin-bottom: 4px;
  font-weight: 500;
  cursor: pointer;
}

input[type="radio"] + span {
  vertical-align: middle;
}

    /* 確認ボタン */
    button {
      width: 100%;
      height: 50px;
      margin-top: 4px;
      border: none;
      border-radius: 6px;
      background-color: #00b84f;
      color: #ffffff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;

      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #009f45;
    }

    button:active {
      background-color: #00883b;
    }

    button:disabled {
      background-color: #aaaaaa;
      cursor: default;
    }

    /* 画像選択・カメラボタン */
.image-button-row {
  display: flex;
  gap: 10px;
  width: 100%;
}

.image-select-button {
  flex: 1;
  width: auto;
  height: 42px;
  margin-top: 0;
  background-color: #29b6f6;
  font-size: 15px;
}

.image-select-button:hover {
  background-color: #039be5;
}

.image-select-button:active {
  background-color: #0288d1;
}

    /* 画像削除ボタン */
.image-delete-button {
  width: auto;
  height: 38px;
  margin-top: 10px;
  padding: 0 18px;
  background-color: #e57373;
  font-size: 14px;
}

.image-delete-button:hover {
  background-color: #ef5350;
}

.image-delete-button:active {
  background-color: #d32f2f;
}

    /* 戻るボタン */
.back-button {
  margin: 0 0 24px;
  background-color: #777777;
}

.back-button:hover {
  background-color: #666666;
}

.back-button:active {
  background-color: #555555;
}


    /* ====================================== */
/* ログイン画面だけ青色 */
/* ====================================== */

#loginScreen h1 {
  color: #1976d2;
}

#loginScreen .container {
  border-top-color: #2196f3;
}

#loginScreen .form-title {
  color: #1976d2;
}

#loginScreen input:focus {
  border-color: #2196f3;
  box-shadow:
    0 0 0 2px rgba(33, 150, 243, 0.12);
}

#loginButton {
  background-color: #1976d2;
}

#loginButton:hover {
  background-color: #1565c0;
}

#loginButton:active {
  background-color: #0d47a1;
}

#loginButton:disabled {
  background-color: #aaaaaa;
}

  /* 資格情報更新に進むボタン */
#nextButton {
margin-top: 24px;
}

    /* 結果表示 */
    #message {
      margin-top: 22px;
      padding: 14px;
      border-radius: 6px;
      font-size: 16px;
      line-height: 1.6;
    }

    #message:empty {
      display: none;
    }

    .success {
      display: block;
      color: #00883b;
      background-color: #f0f8f3;
      border-left: 4px solid #00b84f;
    }

    .error {
      display: block;
      color: #d93025;
      background-color: #fff3f3;
      border-left: 4px solid #d93025;
    }

    /* スマートフォン */
    @media (max-width: 600px) {

      body {
        padding: 12px;
      }

      .page {
        margin: 20px auto;
      }

      h1 {
        font-size: 25px;
      }

      .container {
        padding: 24px 18px;
        margin-bottom: 18px;
      }
    }
  </style>
</head>

<script>

    const LOGIN_FLOW_URL =
  "https://default1a2cf14ad33440fe9e6c8e9728b84d.0d.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/18/workflows/900224f3d8fe43518cc499cb92acacaa/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=EOJhcSwY2zPFCZKymtNpfqc7joa_GBkk05B4Wuxu_RY";

    const FLOW_URL =
      "https://default1a2cf14ad33440fe9e6c8e9728b84d.0d.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/23/workflows/b693c735e232429d960ea490697bd2e4/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=GAz4kHywGHHs_xlSci1Zst9WtPy3F5zSdKd9oVM6riA";

  const UPDATE_FLOW_URL =
  "https://default1a2cf14ad33440fe9e6c8e9728b84d.0d.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/08/workflows/11814fa9cf084e7c8dd0e7c74b15533f/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=SbYxnT67kWWq5KuBasSC_WqkLxIY9Q_36sBqjTWwbGY";

    const loginButton =
  document.getElementById("loginButton");

const loginPassword =
  document.getElementById("loginPassword");

const loginMessage =
  document.getElementById("loginMessage");

const loginScreen =
  document.getElementById("loginScreen");

const employeeScreen =
  document.getElementById("employeeScreen");


loginButton.addEventListener("click", async function () {

  const password =
    loginPassword.value.trim();

  loginMessage.textContent = "";


  if (password === "") {

    loginMessage.textContent =
      "パスワードを入力して下さい。";

    return;
  }


  loginButton.disabled = true;
  loginButton.textContent = "確認中です...";


  try {

    const response =
      await fetch(LOGIN_FLOW_URL, {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          password: password
        })

      });


    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }


    const data =
      await response.json();


    if (data.success === true) {

      loginScreen.style.display = "none";
      employeeScreen.style.display = "block";

      loginPassword.value = "";

    } else {

      loginMessage.textContent =
        "パスワードが違います。";

      loginPassword.value = "";
      loginPassword.focus();

    }


  } catch (error) {

    console.error(error);

    loginMessage.textContent =
      "認証に失敗しました。";

  } finally {

    loginButton.disabled = false;
    loginButton.textContent = "ログイン";

  }

});

  /* Enterキーでもログイン */
loginPassword.addEventListener("keydown", function (event) {

  if (event.key === "Enter") {

    event.preventDefault();

    loginButton.click();

  }

});


    async function sendEmployeeNo() {

      const employeeNo =
        document
          .getElementById("employeeNo")
          .value
          .trim();

      const button =
        document.getElementById("searchButton");

      const message =
        document.getElementById("message");


      message.textContent = "";
      message.className = "";


      if (!employeeNo) {

        message.textContent =
          "従業員番号を入力して下さい。";

        message.className = "error";

        return;
      }


      button.disabled = true;

      button.textContent =
        "確認中です...";


      try {

        const response =
          await fetch(
            FLOW_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                employeeNo: employeeNo
              })
            }
          );


        if (!response.ok) {

          throw new Error(
            "HTTP " + response.status
          );

        }


        const data =
          await response.json();


        if (!data.name) {

          message.textContent =
            "該当する従業員が見つかりませんでした。";

          message.className =
            "error";

          return;
        }


        message.innerHTML =
  "所属ブロック：<strong>" + data.block + "</strong><br>" +
  "所属SS：<strong>" + data.ss + "</strong><br>" +
  "氏名：<strong>" + data.name + "</strong>";

        message.className =
          "success";

        document.getElementById("reportSelect").style.display = "block";


      } catch (error) {

        console.error(error);

        message.textContent =
          "従業員情報の取得に失敗しました。";

        message.className =
          "error";


      } finally {

        button.disabled = false;

        button.textContent =
          "確認する";

      }

    }

    /* 従業員番号は半角数字のみ */
document
  .getElementById("employeeNo")
  .addEventListener("input", function () {

    this.value =
      this.value.replace(/[^0-9]/g, "");

  });


    /* Enterキーでも確認 */
    document
      .getElementById("employeeNo")
      .addEventListener(
        "keydown",
        function (event) {

          if (event.key === "Enter") {
            sendEmployeeNo();
          }

        }
      );

const updateScreen =
  document.getElementById("updateScreen");

    /* ====================================== */
/* 報告内容切り替え */
/* ====================================== */

const licenseGetButton =
  document.getElementById("licenseGetButton");

const licenseUpdateButton =
  document.getElementById("licenseUpdateButton");

const otherQualificationButton =
  document.getElementById("otherQualificationButton");


const licenseGetFields =
  document.getElementById("licenseGetFields");

const licenseUpdateFields =
  document.getElementById("licenseUpdateFields");

const otherQualificationFields =
  document.getElementById("otherQualificationFields");


function hideAllReportFields() {

  licenseGetFields.style.display = "none";

  licenseUpdateFields.style.display = "none";

  otherQualificationFields.style.display = "none";

}


/* 免状取得時 */

licenseGetButton.addEventListener("click", function () {

  hideAllReportFields();

  employeeScreen.style.display = "none";

  updateScreen.style.display = "block";

  licenseGetFields.style.display = "block";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

});

  /* ====================================== */
/* 日付入力の案内表示 */
/* ====================================== */

document.querySelectorAll(".date-input-wrap").forEach(function (wrap) {

  const dateInput =
    wrap.querySelector('input[type="date"]');


  function updateDatePlaceholder() {

    if (dateInput.value) {

      wrap.classList.add("has-value");

    } else {

      wrap.classList.remove("has-value");

    }

  }


  dateInput.addEventListener(
    "change",
    updateDatePlaceholder
  );

  dateInput.addEventListener(
    "input",
    updateDatePlaceholder
  );


  updateDatePlaceholder();

});


/* 免状更新時 */

licenseUpdateButton.addEventListener("click", function () {

  hideAllReportFields();

  employeeScreen.style.display = "none";

/* ====================================== */

const issueDateUpdateButton =
  document.getElementById("issueDateUpdateButton");

const issueDateUpdateMessage =
  document.getElementById("issueDateUpdateMessage");

  /* 画像ファイルをBase64に変換 */
function fileToBase64(file) {

  return new Promise(function (resolve, reject) {

    const reader =
      new FileReader();

    reader.onload = function () {

      const base64 =
        reader.result
          .split(",")[1];

      resolve(base64);

    };

    reader.onerror = function () {

      reject(
        new Error("画像の読み込みに失敗しました。")
      );

    };

    reader.readAsDataURL(file);

  });

}

issueDateUpdateButton.addEventListener("click", async function () {

  const employeeNo =
    document
      .getElementById("employeeNo")
      .value
      .trim();


  /* 危険物有無 */
  const hazardousMaterialSelected =
    document.querySelector(
      'input[name="hazardousMaterial"]:checked'
    );

  const hazardousMaterial =
    hazardousMaterialSelected
      ? hazardousMaterialSelected.value
      : "";


  /* 交付日 */
  const issueDate =
    document
      .getElementById("issueDate")
      .value;


  /* 写真有効期限 */
  const photoExpiryDate =
    document
      .getElementById("licensePhotoExpiryDate")
      .value;

  /* 危険物免状 表 */
const licenseFrontImage =
  licenseFrontFile.files[0] ||
  licenseFrontCamera.files[0];


/* 危険物免状 裏 */
const licenseBackImage =
  licenseBackFile.files[0] ||
  licenseBackCamera.files[0];


  issueDateUpdateMessage.textContent = "";
  issueDateUpdateMessage.className = "";


  /* ====================================== */
  /* 必須チェック */
  /* ====================================== */

  if (!hazardousMaterial) {

    issueDateUpdateMessage.textContent =
      "危険物有無を選択して下さい。";

    issueDateUpdateMessage.className =
      "error";

    return;
  }


  if (!issueDate) {

    issueDateUpdateMessage.textContent =
      "交付日を選択して下さい。";

    issueDateUpdateMessage.className =
      "error";

    return;
  }


  if (!photoExpiryDate) {

    issueDateUpdateMessage.textContent =
      "写真有効期限を選択して下さい。";

    issueDateUpdateMessage.className =
      "error";

    return;
  }

    if (!licenseFrontImage) {

  issueDateUpdateMessage.textContent =
    "危険物免状（表）の画像を選択または撮影して下さい。";

  issueDateUpdateMessage.className =
    "error";

  return;
}


if (!licenseBackImage) {

  issueDateUpdateMessage.textContent =
    "危険物免状（裏）の画像を選択または撮影して下さい。";

  issueDateUpdateMessage.className =
    "error";

  return;
}


  /* ====================================== */
  /* Power Automateへ送信 */
  /* ====================================== */

  issueDateUpdateButton.disabled = true;

  issueDateUpdateButton.textContent =
    "更新中です...";


  try {

        /* 表・裏画像をBase64へ変換 */
    const licenseFrontBase64 =
      await fileToBase64(licenseFrontImage);

    const licenseBackBase64 =
      await fileToBase64(licenseBackImage);

    const response =
      await fetch(
        UPDATE_FLOW_URL,
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({

  employeeNo: employeeNo,

  updateType: "licenseGet",

  hazardousMaterial:
    hazardousMaterial,

  issueDate:
    issueDate,

  photoExpiryDate:
    photoExpiryDate,

  licenseFront:
    licenseFrontBase64,

  licenseFrontName:
    licenseFrontImage.name,

  licenseBack:
    licenseBackBase64,

  licenseBackName:
    licenseBackImage.name

})

        }
      );


    if (!response.ok) {

      throw new Error(
        "HTTP " + response.status
      );

    }


    const data =
      await response.json();


    if (data.success !== true) {

      throw new Error(
        "更新処理が正常終了しませんでした。"
      );

    }


    issueDateUpdateMessage.textContent =
      "資格情報を更新しました。";

    issueDateUpdateMessage.className =
      "success";


  } catch (error) {

    console.error(error);

    issueDateUpdateMessage.textContent =
      "資格情報の更新に失敗しました。";

    issueDateUpdateMessage.className =
      "error";


  } finally {

    issueDateUpdateButton.disabled = false;

    issueDateUpdateButton.textContent =
      "更新する";

  }

});
  
  </script>
