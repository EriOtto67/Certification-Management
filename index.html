<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>従業員情報確認</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: #f5f5f5;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;
      color: #444;
    }

    /* ページ全体 */
    .page {
      width: 100%;
      max-width: 650px;
      margin: 40px auto;
    }

    /* タイトル */
    h1 {
      margin: 0 0 30px;
      color: #00b84f;
      font-size: 30px;
      font-weight: 700;
      text-align: center;
    }

    /* カード */
    .container {
      width: 100%;
      background-color: #ffffff;
      border-top: 5px solid #00c853;
      border-radius: 12px;
      padding: 30px;
      margin-bottom: 24px;

      box-shadow:
        0 3px 8px rgba(0, 0, 0, 0.12);
    }

    /* カードタイトル */
    .form-title {
      margin: 0 0 25px;
      color: #00b84f;
      font-size: 20px;
      font-weight: 700;
    }

    /* 資格情報更新画面の小見出し */
#licenseGetFields > .form-title,
#licenseUpdateFields > .form-title,
#otherQualificationFields > .form-title {
  margin-top: 28px;
  padding-top: 20px;
  border-top: 2px solid #00c853;
}

    /* 入力項目 */
    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #444;
      font-size: 15px;
      font-weight: 600;
    }

    .required {
      display: inline-block;
      margin-left: 6px;
      color: #e74c3c;
      font-size: 12px;
      font-weight: 600;
    }

    /* 入力欄 */
    input {
      width: 100%;
      height: 48px;
      padding: 10px 12px;
      border: 1px solid #cccccc;
      border-radius: 6px;
      background-color: #ffffff;
      color: #333;
      font-size: 16px;
      outline: none;

      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }

    /* 日付入力欄のスマホはみ出し防止 */
input[type="date"] {
  display: block;
  width: 100%;
  max-width: 100%;
  min-width: 0;
  -webkit-appearance: none;
  appearance: none;
}

    input:focus {
      border-color: #00c853;

      box-shadow:
        0 0 0 2px rgba(0, 200, 83, 0.12);
    }

    /* 確認ボタン */
    button {
      width: 100%;
      height: 50px;
      margin-top: 4px;
      border: none;
      border-radius: 6px;
      background-color: #00b84f;
      color: #ffffff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;

      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #009f45;
    }

    button:active {
      background-color: #00883b;
    }

    button:disabled {
      background-color: #aaaaaa;
      cursor: default;
    }

    /* 戻るボタン */
.back-button {
  margin: 0 0 24px;
  background-color: #777777;
}

.back-button:hover {
  background-color: #666666;
}

.back-button:active {
  background-color: #555555;
}


    /* ====================================== */
/* ログイン画面だけ青色 */
/* ====================================== */

#loginScreen h1 {
  color: #1976d2;
}

#loginScreen .container {
  border-top-color: #2196f3;
}

#loginScreen .form-title {
  color: #1976d2;
}

#loginScreen input:focus {
  border-color: #2196f3;
  box-shadow:
    0 0 0 2px rgba(33, 150, 243, 0.12);
}

#loginButton {
  background-color: #1976d2;
}

#loginButton:hover {
  background-color: #1565c0;
}

#loginButton:active {
  background-color: #0d47a1;
}

#loginButton:disabled {
  background-color: #aaaaaa;
}

  /* 資格情報更新に進むボタン */
#nextButton {
margin-top: 24px;
}

    /* 結果表示 */
    #message {
      margin-top: 22px;
      padding: 14px;
      border-radius: 6px;
      font-size: 16px;
      line-height: 1.6;
    }

    #message:empty {
      display: none;
    }

    .success {
      display: block;
      color: #00883b;
      background-color: #f0f8f3;
      border-left: 4px solid #00b84f;
    }

    .error {
      display: block;
      color: #d93025;
      background-color: #fff3f3;
      border-left: 4px solid #d93025;
    }

    /* スマートフォン */
    @media (max-width: 600px) {

      body {
        padding: 12px;
      }

      .page {
        margin: 20px auto;
      }

      h1 {
        font-size: 25px;
      }

      .container {
        padding: 24px 18px;
        margin-bottom: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <!-- ====================================== -->
    <!-- ログイン画面 -->
    <!-- ====================================== -->

    <div id="loginScreen">

      <h1>資格情報更新</h1>

      <div class="container">

        <div class="form-title">
          ログイン
        </div>

        <div class="form-group">

          <label for="loginPassword">
            パスワード
            <span class="required">必須</span>
          </label>

          <input
            type="password"
            id="loginPassword"
            placeholder="パスワードを入力して下さい"
            autocomplete="off"
          >

        </div>

        <button
          type="button"
          id="loginButton"
        >
          ログイン
        </button>

        <div id="loginMessage"></div>

      </div>

    </div>


    <!-- ====================================== -->
    <!-- 従業員情報確認画面 -->
    <!-- ====================================== -->

    <div id="employeeScreen" style="display: none;">

      <h1>従業員情報確認</h1>

    <div class="container">

      <div class="form-title">
        従業員検索
      </div>

      <div class="form-group">

        <label for="employeeNo">
          従業員番号
          <span class="required">必須</span>
        </label>

        <input
  type="text"
  id="employeeNo"
  inputmode="numeric"
  pattern="[0-9]*"
  placeholder="従業員番号を入力して下さい"
  autocomplete="off"
>

      </div>

      <button
        type="button"
        id="searchButton"
        onclick="sendEmployeeNo()"
      >
        確認する
      </button>

      <div id="message"></div>


<!-- ====================================== -->
<!-- 報告内容選択 -->
<!-- ====================================== -->

<div
  id="reportSelect"
  style="display: none;"
>

  <div class="form-title" style="margin-top: 28px;">
    報告内容を選択して下さい
  </div>

  <button
    type="button"
    id="licenseGetButton"
  >
    免状取得時
  </button>

  <button
    type="button"
    id="licenseUpdateButton"
    style="margin-top: 12px;"
  >
    免状更新時
  </button>

  <button
    type="button"
    id="otherQualificationButton"
    style="margin-top: 12px;"
  >
    その他資格取得時
  </button>

</div>

</div>

</div>
<!-- employeeScreen 終了 -->


<!-- ====================================== -->
<!-- 資格情報更新画面 -->
<!-- ====================================== -->

<div
  id="updateScreen"
  style="display: none;"
>

  <h1>資格情報更新</h1>

  <div class="container">

    <div class="form-title">
      更新情報入力
    </div>

    <button
  type="button"
  id="backToReportSelectButton"
  class="back-button"
>
  報告内容選択に戻る
</button>


<!-- ====================================== -->
<!-- 免状取得時 -->
<!-- ====================================== -->

<div
  id="licenseGetFields"
  style="display: none;"
>

  <div class="form-title">
    免状取得時
  </div>

  <div class="form-group">

  <label for="issueDate">
    交付日
    <span class="required">必須</span>
  </label>

  <input
    type="date"
    id="issueDate"
  >

  <button
    type="button"
    id="issueDateUpdateButton"
    style="margin-top: 20px;"
  >
    更新する
  </button>

  <div id="issueDateUpdateMessage"></div>

</div>

</div>


<!-- ====================================== -->
<!-- 免状更新時 -->
<!-- ====================================== -->

<div
  id="licenseUpdateFields"
  style="display: none;"
>

  <div class="form-title">
    免状更新時
  </div>

  <div class="form-group">

    <label for="photoExpiryDate">
      写真有効期限
      <span class="required">必須</span>
    </label>

    <input
      type="date"
      id="photoExpiryDate"
    >

  </div>

</div>


<!-- ====================================== -->
<!-- その他資格取得時 -->
<!-- ====================================== -->

<div
  id="otherQualificationFields"
  style="display: none;"
>

  <div class="form-title">
    その他資格取得時
  </div>

  <div class="form-group">

    <label for="otherQualification">
      その他資格
      <span class="required">必須</span>
    </label>

    <input
      type="text"
      id="otherQualification"
      placeholder="取得した資格を入力して下さい"
      autocomplete="off"
    >

  </div>

</div>

    </div>

</div>
<!-- updateScreen 終了 -->

</div>
<!-- page 終了 -->


<script>

    const LOGIN_FLOW_URL =
  "https://default1a2cf14ad33440fe9e6c8e9728b84d.0d.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/18/workflows/900224f3d8fe43518cc499cb92acacaa/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=EOJhcSwY2zPFCZKymtNpfqc7joa_GBkk05B4Wuxu_RY";

    const FLOW_URL =
      "https://default1a2cf14ad33440fe9e6c8e9728b84d.0d.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/23/workflows/b693c735e232429d960ea490697bd2e4/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=GAz4kHywGHHs_xlSci1Zst9WtPy3F5zSdKd9oVM6riA";

  const UPDATE_FLOW_URL =
  "https://default1a2cf14ad33440fe9e6c8e9728b84d.0d.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/08/workflows/11814fa9cf084e7c8dd0e7c74b15533f/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=SbYxnT67kWWq5KuBasSC_WqkLxIY9Q_36sBqjTWwbGY";

    const loginButton =
  document.getElementById("loginButton");

const loginPassword =
  document.getElementById("loginPassword");

const loginMessage =
  document.getElementById("loginMessage");

const loginScreen =
  document.getElementById("loginScreen");

const employeeScreen =
  document.getElementById("employeeScreen");


loginButton.addEventListener("click", async function () {

  const password =
    loginPassword.value.trim();

  loginMessage.textContent = "";


  if (password === "") {

    loginMessage.textContent =
      "パスワードを入力して下さい。";

    return;
  }


  loginButton.disabled = true;
  loginButton.textContent = "確認中です...";


  try {

    const response =
      await fetch(LOGIN_FLOW_URL, {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          password: password
        })

      });


    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }


    const data =
      await response.json();


    if (data.success === true) {

      loginScreen.style.display = "none";
      employeeScreen.style.display = "block";

      loginPassword.value = "";

    } else {

      loginMessage.textContent =
        "パスワードが違います。";

      loginPassword.value = "";
      loginPassword.focus();

    }


  } catch (error) {

    console.error(error);

    loginMessage.textContent =
      "認証に失敗しました。";

  } finally {

    loginButton.disabled = false;
    loginButton.textContent = "ログイン";

  }

});

  /* Enterキーでもログイン */
loginPassword.addEventListener("keydown", function (event) {

  if (event.key === "Enter") {

    event.preventDefault();

    loginButton.click();

  }

});


    async function sendEmployeeNo() {

      const employeeNo =
        document
          .getElementById("employeeNo")
          .value
          .trim();

      const button =
        document.getElementById("searchButton");

      const message =
        document.getElementById("message");


      message.textContent = "";
      message.className = "";


      if (!employeeNo) {

        message.textContent =
          "従業員番号を入力して下さい。";

        message.className = "error";

        return;
      }


      button.disabled = true;

      button.textContent =
        "確認中です...";


      try {

        const response =
          await fetch(
            FLOW_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                employeeNo: employeeNo
              })
            }
          );


        if (!response.ok) {

          throw new Error(
            "HTTP " + response.status
          );

        }


        const data =
          await response.json();


        if (!data.name) {

          message.textContent =
            "該当する従業員が見つかりませんでした。";

          message.className =
            "error";

          return;
        }


        message.innerHTML =
  "所属ブロック：<strong>" + data.block + "</strong><br>" +
  "所属SS：<strong>" + data.ss + "</strong><br>" +
  "氏名：<strong>" + data.name + "</strong>";

        message.className =
          "success";

        document.getElementById("reportSelect").style.display = "block";


      } catch (error) {

        console.error(error);

        message.textContent =
          "従業員情報の取得に失敗しました。";

        message.className =
          "error";


      } finally {

        button.disabled = false;

        button.textContent =
          "確認する";

      }

    }

    /* 従業員番号は半角数字のみ */
document
  .getElementById("employeeNo")
  .addEventListener("input", function () {

    this.value =
      this.value.replace(/[^0-9]/g, "");

  });


    /* Enterキーでも確認 */
    document
      .getElementById("employeeNo")
      .addEventListener(
        "keydown",
        function (event) {

          if (event.key === "Enter") {
            sendEmployeeNo();
          }

        }
      );

const updateScreen =
  document.getElementById("updateScreen");

    /* ====================================== */
/* 報告内容切り替え */
/* ====================================== */

const licenseGetButton =
  document.getElementById("licenseGetButton");

const licenseUpdateButton =
  document.getElementById("licenseUpdateButton");

const otherQualificationButton =
  document.getElementById("otherQualificationButton");


const licenseGetFields =
  document.getElementById("licenseGetFields");

const licenseUpdateFields =
  document.getElementById("licenseUpdateFields");

const otherQualificationFields =
  document.getElementById("otherQualificationFields");


function hideAllReportFields() {

  licenseGetFields.style.display = "none";

  licenseUpdateFields.style.display = "none";

  otherQualificationFields.style.display = "none";

}


/* 免状取得時 */

licenseGetButton.addEventListener("click", function () {

  hideAllReportFields();

  employeeScreen.style.display = "none";

  updateScreen.style.display = "block";

  licenseGetFields.style.display = "block";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

});


/* 免状更新時 */

licenseUpdateButton.addEventListener("click", function () {

  hideAllReportFields();

  employeeScreen.style.display = "none";

  updateScreen.style.display = "block";

  licenseUpdateFields.style.display = "block";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

});

/* その他資格取得時 */

otherQualificationButton.addEventListener("click", function () {

  hideAllReportFields();

  employeeScreen.style.display = "none";

  updateScreen.style.display = "block";

  otherQualificationFields.style.display = "block";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

});

  /* ====================================== */
/* 報告内容選択画面へ戻る */
/* ====================================== */

const backToReportSelectButton =
  document.getElementById("backToReportSelectButton");


backToReportSelectButton.addEventListener("click", function () {

  /* 入力内容をクリア */
  document.getElementById("issueDate").value = "";

  document.getElementById("photoExpiryDate").value = "";

  document.getElementById("otherQualification").value = "";


  /* 更新結果メッセージもクリア */
  issueDateUpdateMessage.textContent = "";
  issueDateUpdateMessage.className = "";


  /* 各報告項目を非表示 */
  hideAllReportFields();


  /* 資格情報更新画面を閉じる */
  updateScreen.style.display = "none";


  /* 従業員情報確認画面へ戻る */
  employeeScreen.style.display = "block";

  document
    .getElementById("reportSelect")
    .style.display = "block";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

});

  /* ====================================== */
/* 免状取得時・交付日更新 */
/* ====================================== */

const issueDateUpdateButton =
  document.getElementById("issueDateUpdateButton");

const issueDateUpdateMessage =
  document.getElementById("issueDateUpdateMessage");


issueDateUpdateButton.addEventListener("click", async function () {

  const employeeNo =
    document
      .getElementById("employeeNo")
      .value
      .trim();

  const issueDate =
    document
      .getElementById("issueDate")
      .value;


  issueDateUpdateMessage.textContent = "";
  issueDateUpdateMessage.className = "";


  /* 交付日未入力 */
  if (!issueDate) {

    issueDateUpdateMessage.textContent =
      "交付日を入力して下さい。";

    issueDateUpdateMessage.className =
      "error";

    return;
  }


  issueDateUpdateButton.disabled = true;

  issueDateUpdateButton.textContent =
    "更新中です...";


  try {

    const response =
      await fetch(
        UPDATE_FLOW_URL,
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            employeeNo: employeeNo,
            updateType: "licenseGet",
            issueDate: issueDate
          })
        }
      );


    if (!response.ok) {

      throw new Error(
        "HTTP " + response.status
      );

    }


    const data =
      await response.json();


    if (data.success !== true) {

      throw new Error(
        "更新処理が正常終了しませんでした。"
      );

    }


    issueDateUpdateMessage.textContent =
      "交付日を更新しました。";

    issueDateUpdateMessage.className =
      "success";


  } catch (error) {

    console.error(error);

    issueDateUpdateMessage.textContent =
      "交付日の更新に失敗しました。";

    issueDateUpdateMessage.className =
      "error";


  } finally {

    issueDateUpdateButton.disabled = false;

    issueDateUpdateButton.textContent =
      "更新する";

  }

});
  
  </script>

</body>

</html>
