<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>従業員情報確認</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: #f5f5f5;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;
      color: #444;
    }

    /* ページ全体 */
    .page {
      width: 100%;
      max-width: 650px;
      margin: 40px auto;
    }

    /* タイトル */
    h1 {
      margin: 0 0 30px;
      color: #00b84f;
      font-size: 30px;
      font-weight: 700;
      text-align: center;
    }

    /* カード */
    .container {
      width: 100%;
      background-color: #ffffff;
      border-top: 5px solid #00c853;
      border-radius: 12px;
      padding: 30px;
      margin-bottom: 24px;

      box-shadow:
        0 3px 8px rgba(0, 0, 0, 0.12);
    }

    /* カードタイトル */
    .form-title {
      margin: 0 0 25px;
      color: #00b84f;
      font-size: 20px;
      font-weight: 700;
    }

    /* 資格情報更新画面の小見出し */
#licenseGetFields > .form-title,
#licenseUpdateFields > .form-title,
#otherQualificationFields > .form-title {
  margin-top: 28px;
  padding-top: 20px;
  border-top: 2px solid #00c853;
}

    /* 報告内容選択の区切り線 */
#reportSelect > .form-title {
  padding-top: 20px;
  border-top: 2px solid #00c853;
}

    /* 入力項目 */
    .form-group {
      margin-bottom: 24px;
    }

    /* ====================================== */
/* 免状更新時・現在の登録内容 */
/* ====================================== */

.current-data-area {
  margin-bottom: 28px;
  padding: 18px;
  background-color: #f0f8f3;
  border-left: 4px solid #00b84f;
  border-radius: 6px;
}

.current-data-title {
  margin-bottom: 14px;
  color: #00883b;
  font-size: 17px;
  font-weight: 700;
}

.current-data-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  padding: 10px 0;
  border-bottom: 1px solid #d7e8dc;
  font-size: 15px;
  line-height: 1.5;
}

.current-data-row:last-child {
  border-bottom: none;
}

    /* 現在登録されている免状画像 */
.current-license-image-area {
  padding: 14px 0;
  border-top: 1px solid #d7e8dc;
}

.current-license-empty {
  margin-top: 8px;
  color: #888888;
  font-size: 14px;
}

.current-data-label {
  flex-shrink: 0;
  color: #555555;
  font-weight: 600;
}

.current-data-row span:last-child {
  color: #222222;
  font-weight: 600;
  text-align: right;
  overflow-wrap: anywhere;
}


/* 更新入力欄の見出し */
.update-input-title {
  margin: 28px 0 24px;
  padding-top: 20px;
  border-top: 2px solid #00c853;
  color: #00b84f;
  font-size: 18px;
  font-weight: 700;
}

    label {
      display: block;
      margin-bottom: 8px;
      color: #444;
      font-size: 15px;
      font-weight: 600;
    }

    .required {
      display: inline-block;
      margin-left: 6px;
      color: #e74c3c;
      font-size: 12px;
      font-weight: 600;
    }

    /* 入力欄 */
    input {
      width: 100%;
      height: 48px;
      padding: 10px 12px;
      border: 1px solid #cccccc;
      border-radius: 6px;
      background-color: #ffffff;
      color: #333;
      font-size: 16px;
      outline: none;

      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }

    /* 日付入力欄のスマホはみ出し防止 */
input[type="date"] {
  display: block;
  width: 100%;
  max-width: 100%;
  min-width: 0;
  -webkit-appearance: none;
  appearance: none;
}

    /* 日付入力の案内表示 */
.date-input-wrap {
  position: relative;
  width: 100%;
}

.date-input-wrap input[type="date"] {
  color: transparent;
}

.date-input-wrap .date-placeholder {
  position: absolute;
  top: 50%;
  left: 12px;
  transform: translateY(-50%);
  color: #888888;
  font-size: 16px;
  pointer-events: none;
}

.date-input-wrap.has-value input[type="date"] {
  color: #333333;
}

.date-input-wrap.has-value .date-placeholder {
  display: none;
}

    /* 自動計算される日付 */
.auto-calculated-date {
  background-color: #eeeeee;
  color: #666666;
  cursor: default;
}

.auto-calculated-date:focus {
  border-color: #cccccc;
  box-shadow: none;
}

    input:focus {
      border-color: #00c853;

      box-shadow:
        0 0 0 2px rgba(0, 200, 83, 0.12);
    }

    /* ラジオボタン */
input[type="radio"] {
  width: 18px;
  height: 18px;
  margin: 0 8px 0 0;
  padding: 0;
  accent-color: #00b84f;
  vertical-align: middle;
  box-shadow: none;
}

    #licenseGetFields label:has(input[type="radio"]) {
  display: flex;
  align-items: center;
  min-height: 42px;
  margin-bottom: 4px;
  font-weight: 500;
  cursor: pointer;
}

input[type="radio"] + span {
  vertical-align: middle;
}

    /* 確認ボタン */
    button {
      width: 100%;
      height: 50px;
      margin-top: 4px;
      border: none;
      border-radius: 6px;
      background-color: #00b84f;
      color: #ffffff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;

      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #009f45;
    }

    button:active {
      background-color: #00883b;
    }

    button:disabled {
      background-color: #aaaaaa;
      cursor: default;
    }

    /* 画像選択・カメラボタン */
.image-button-row {
  display: flex;
  gap: 10px;
  width: 100%;
}

.image-select-button {
  flex: 1;
  width: auto;
  height: 42px;
  margin-top: 0;
  background-color: #29b6f6;
  font-size: 15px;
}

.image-select-button:hover {
  background-color: #039be5;
}

.image-select-button:active {
  background-color: #0288d1;
}

    /* 画像削除ボタン */
.image-delete-button {
  width: auto;
  height: 38px;
  margin-top: 10px;
  padding: 0 18px;
  background-color: #e57373;
  font-size: 14px;
}

.image-delete-button:hover {
  background-color: #ef5350;
}

.image-delete-button:active {
  background-color: #d32f2f;
}

    /* 更新ボタン上の区切り線 */
.update-button-area {
  margin-top: 28px;
  padding-top: 20px;
  border-top: 2px solid #00c853;
}

    /* 戻るボタン */
.back-button {
  margin: 0 0 24px;
  background-color: #777777;
}

.back-button:hover {
  background-color: #666666;
}

.back-button:active {
  background-color: #555555;
}


    /* ====================================== */
/* ログイン画面だけ青色 */
/* ====================================== */

#loginScreen h1 {
  color: #1976d2;
}

#loginScreen .container {
  border-top-color: #2196f3;
}

#loginScreen .form-title {
  color: #1976d2;
}

#loginScreen input:focus {
  border-color: #2196f3;
  box-shadow:
    0 0 0 2px rgba(33, 150, 243, 0.12);
}

#loginButton {
  background-color: #1976d2;
}

#loginButton:hover {
  background-color: #1565c0;
}

#loginButton:active {
  background-color: #0d47a1;
}

#loginButton:disabled {
  background-color: #aaaaaa;
}

  /* 資格情報更新に進むボタン */
#nextButton {
margin-top: 24px;
}

    /* 結果表示 */
    #message {
      margin-top: 22px;
      padding: 14px;
      border-radius: 6px;
      font-size: 16px;
      line-height: 1.6;
    }

    #message:empty {
      display: none;
    }

    .success {
      display: block;
      color: #00883b;
      background-color: #f0f8f3;
      border-left: 4px solid #00b84f;
    }

    .error {
      display: block;
      color: #d93025;
      background-color: #fff3f3;
      border-left: 4px solid #d93025;
    }

    /* スマートフォン */
    @media (max-width: 600px) {

      body {
        padding: 12px;
      }

      .page {
        margin: 20px auto;
      }

      h1 {
        font-size: 25px;
      }

      .container {
        padding: 24px 18px;
        margin-bottom: 18px;
      }
    }

        /* ====================================== */
    /* 更新確認用パスワードポップアップ */
    /* ====================================== */

    .password-modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
      width: 100%;
      height: 100%;
      padding: 20px;
      background-color: rgba(0, 0, 0, 0.55);
      align-items: center;
      justify-content: center;
    }

    .password-modal-overlay.is-open {
      display: flex;
    }

    .password-modal {
      width: 100%;
      max-width: 420px;
      padding: 26px;
      background-color: #ffffff;
      border-top: 5px solid #00c853;
      border-radius: 12px;
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.28);
    }

    .password-modal-title {
      margin: 0 0 12px;
      color: #00b84f;
      font-size: 20px;
      font-weight: 700;
    }

    .password-modal-description {
      margin: 0 0 20px;
      color: #555555;
      font-size: 15px;
      line-height: 1.6;
    }

    .password-modal-button-row {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .password-modal-button-row button {
      flex: 1;
      width: auto;
      margin-top: 0;
    }

    .password-modal-cancel-button {
      background-color: #777777;
    }

    .password-modal-cancel-button:hover {
      background-color: #666666;
    }

    .password-modal-cancel-button:active {
      background-color: #555555;
    }

    #updatePasswordMessage {
      margin-top: 14px;
      color: #d93025;
      font-size: 14px;
      line-height: 1.5;
    }

    #updatePasswordMessage:empty {
      display: none;
    }
    
  </style>
</head>

<body>

  <div class="page">

    <!-- ====================================== -->
    <!-- ログイン画面 -->
    <!-- ====================================== -->

    <div id="loginScreen">

      <h1>資格情報更新</h1>

      <div class="container">

        <div class="form-title">
          ログイン
        </div>

        <div class="form-group">

          <label for="loginPassword">
            パスワード
            <span class="required">必須</span>
          </label>

          <input
            type="password"
            id="loginPassword"
            placeholder="パスワードを入力して下さい"
            autocomplete="off"
          >

        </div>

        <button
          type="button"
          id="loginButton"
        >
          ログイン
        </button>

        <div id="loginMessage"></div>

      </div>

    </div>


    <!-- ====================================== -->
    <!-- 従業員情報確認画面 -->
    <!-- ====================================== -->

    <div id="employeeScreen" style="display: none;">

      <h1>従業員情報確認</h1>

    <div class="container">

      <div class="form-title">
        従業員検索
      </div>

      <div class="form-group">

        <label for="employeeNo">
          従業員番号
          <span class="required">必須</span>
        </label>

        <input
  type="text"
  id="employeeNo"
  inputmode="numeric"
  pattern="[0-9]*"
  placeholder="従業員番号を入力して下さい"
  autocomplete="off"
>

      </div>

            <div class="form-group">

        <label for="employeeSearchPassword">
          確認用パスワード
          <span class="required">必須</span>
        </label>

        <input
          type="password"
          id="employeeSearchPassword"
          placeholder="確認用パスワードを入力して下さい"
          autocomplete="off"
        >

      </div>

      <button
        type="button"
        id="searchButton"
        onclick="sendEmployeeNo()"
      >
        確認する
      </button>

      <div id="message"></div>


<!-- ====================================== -->
<!-- 報告内容選択 -->
<!-- ====================================== -->

<div
  id="reportSelect"
  style="display: none;"
>

  <div class="form-title" style="margin-top: 28px;">
    報告内容を選択して下さい
  </div>

  <button
    type="button"
    id="licenseGetButton"
  >
    免状取得時
  </button>

  <button
    type="button"
    id="licenseUpdateButton"
    style="margin-top: 12px;"
  >
    免状更新時
  </button>

  <button
    type="button"
    id="otherQualificationButton"
    style="margin-top: 12px;"
  >
    その他資格取得時
  </button>

</div>

</div>

</div>
<!-- employeeScreen 終了 -->


<!-- ====================================== -->
<!-- 資格情報更新画面 -->
<!-- ====================================== -->

<div
  id="updateScreen"
  style="display: none;"
>

  <h1>資格情報更新</h1>

  <div class="container">

    <div class="form-title">
      更新情報入力
    </div>

    <button
  type="button"
  id="backToReportSelectButton"
  class="back-button"
>
  報告内容選択に戻る
</button>


<!-- ====================================== -->
<!-- 免状取得時 -->
<!-- ====================================== -->

<div
  id="licenseGetFields"
  style="display: none;"
>

  <div class="form-title">
    免状取得時
  </div>


  <!-- 危険物有無 -->
  <div class="form-group">

    <label>
      危険物有無
      <span class="required">必須</span>
    </label>

    <label>
      <input
        type="radio"
        name="hazardousMaterial"
        value="いいえ"
      >
      いいえ
    </label>

    <label>
      <input
        type="radio"
        name="hazardousMaterial"
        value="丙種のみ"
      >
      丙種のみ
    </label>

    <label>
      <input
        type="radio"
        name="hazardousMaterial"
        value="はい（乙4または甲種を取得）"
      >
      はい（乙4または甲種を取得）
    </label>

  </div>


  <!-- 交付日 -->
  <div class="form-group">

    <label for="issueDate">
      交付日
      <span class="required">必須</span>
    </label>

    <div class="date-input-wrap">

  <input
    type="date"
    id="issueDate"
  >

  <span class="date-placeholder">
    カレンダーから選択
  </span>

</div>

  </div>


  <!-- 写真有効期限 -->
<div class="form-group">

  <label for="licensePhotoExpiryDate">
    写真有効期限
    <span class="required">必須</span>
  </label>

  <div class="date-input-wrap">

    <input
      type="date"
      id="licensePhotoExpiryDate"
    >

    <span class="date-placeholder">
      カレンダーから選択
    </span>

  </div>

</div>

  <!-- ====================================== -->
<!-- 危険物免状 表 -->
<!-- ====================================== -->

<div class="form-group">

  <label>
    危険物免状（表）
    <span class="required">必須</span>
  </label>

  <!-- 画像選択 -->
  <input
    type="file"
    id="licenseFrontFile"
    accept="image/*"
    style="display: none;"
  >

  <!-- カメラ撮影 -->
  <input
    type="file"
    id="licenseFrontCamera"
    accept="image/*"
    capture="environment"
    style="display: none;"
  >

  <div class="image-button-row">

  <button
    type="button"
    id="licenseFrontFileButton"
    class="image-select-button"
  >
    画像を選択
  </button>

  <button
    type="button"
    id="licenseFrontCameraButton"
    class="image-select-button"
  >
    カメラを起動
  </button>

</div>

  <img
    id="licenseFrontPreview"
    alt="危険物免状 表 プレビュー"
    style="
      display: none;
      width: 100%;
      max-height: 350px;
      object-fit: contain;
      margin-top: 16px;
      border: 1px solid #cccccc;
      border-radius: 6px;
    "
  >

  <button
  type="button"
  id="licenseFrontDeleteButton"
  class="image-delete-button"
  style="display: none;"
>
  画像を削除
</button>

</div>


<!-- ====================================== -->
<!-- 危険物免状 裏 -->
<!-- ====================================== -->

<div class="form-group">

  <label>
    危険物免状（裏）
    <span class="required">必須</span>
  </label>

  <!-- 画像選択 -->
  <input
    type="file"
    id="licenseBackFile"
    accept="image/*"
    style="display: none;"
  >

  <!-- カメラ撮影 -->
  <input
    type="file"
    id="licenseBackCamera"
    accept="image/*"
    capture="environment"
    style="display: none;"
  >

  <div class="image-button-row">

  <button
    type="button"
    id="licenseBackFileButton"
    class="image-select-button"
  >
    画像を選択
  </button>

  <button
    type="button"
    id="licenseBackCameraButton"
    class="image-select-button"
  >
    カメラを起動
  </button>

</div>

  <img
    id="licenseBackPreview"
    alt="危険物免状 裏 プレビュー"
    style="
      display: none;
      width: 100%;
      max-height: 350px;
      object-fit: contain;
      margin-top: 16px;
      border: 1px solid #cccccc;
      border-radius: 6px;
    "
  >

  <button
  type="button"
  id="licenseBackDeleteButton"
  class="image-delete-button"
  style="display: none;"
>
  画像を削除
</button>

</div>

  <div class="update-button-area">

  <button
    type="button"
    id="issueDateUpdateButton"
  >
    更新する
  </button>

  <div id="issueDateUpdateMessage"></div>

</div>

</div>

<!-- ====================================== -->
<!-- 免状更新時 -->
<!-- ====================================== -->

<div
  id="licenseUpdateFields"
  style="display: none;"
>

  <div class="form-title">
    免状更新時
  </div>

  <!-- ====================================== -->
<!-- 現在の登録内容 -->
<!-- ====================================== -->

<div class="current-data-area">

  <div class="current-data-title">
    現在の登録内容
  </div>

  <div class="current-data-row">

    <span class="current-data-label">
      写真有効期限
    </span>

    <span id="currentPhotoExpiryDateDisplay">
      未登録
    </span>

  </div>

  <div class="current-data-row">

    <span class="current-data-label">
      保安講習受講日
    </span>

    <span id="currentSafetyTrainingDateDisplay">
      未登録
    </span>

  </div>

  <div class="current-data-row">

  <span class="current-data-label">
    保安講習受講予定日
  </span>

  <span id="currentSafetyTrainingScheduledDateDisplay">
    未登録
  </span>

</div>

</div>
<!-- ↑ current-data-area を閉じる -->


<div class="update-input-title">
  更新する内容
</div>

  <div class="form-group">

  <label for="photoExpiryDate">
    写真有効期限
  </label>

  <div class="date-input-wrap">

    <input
      type="date"
      id="photoExpiryDate"
    >

    <span class="date-placeholder">
      カレンダーから選択
    </span>

  </div>

</div>

  <!-- 保安講習受講日 -->
<div class="form-group">

  <label for="safetyTrainingDate">
    保安講習受講日
  </label>

  <div class="date-input-wrap">

    <input
      type="date"
      id="safetyTrainingDate"
    >

    <span class="date-placeholder">
      カレンダーから選択
    </span>

  </div>

</div>


<!-- 保安講習受講予定日 -->
<div class="form-group">

  <label for="safetyTrainingScheduledDate">
    保安講習受講予定日
  </label>

  <div class="date-input-wrap">

    <input
  type="date"
  id="safetyTrainingScheduledDate"
  readonly
  class="auto-calculated-date"
>

    <span class="date-placeholder">
      自動計算
    </span>

  </div>

</div>

  <!-- ====================================== -->
<!-- 更新する危険物免状 表 -->
<!-- ====================================== -->

<div class="form-group">

  <label>
    危険物免状（表）
    <span class="optional">変更する場合のみ</span>
  </label>

  <input
    type="file"
    id="updateLicenseFrontFile"
    accept="image/*"
    style="display: none;"
  >

  <input
    type="file"
    id="updateLicenseFrontCamera"
    accept="image/*"
    capture="environment"
    style="display: none;"
  >

  <div class="image-button-row">

    <button
      type="button"
      id="updateLicenseFrontFileButton"
      class="image-select-button"
    >
      画像を選択
    </button>

    <button
      type="button"
      id="updateLicenseFrontCameraButton"
      class="image-select-button"
    >
      カメラを起動
    </button>

  </div>

  <img
    id="updateLicenseFrontPreview"
    alt="更新する危険物免状 表 プレビュー"
    style="
      display: none;
      width: 100%;
      max-height: 350px;
      object-fit: contain;
      margin-top: 16px;
      border: 1px solid #cccccc;
      border-radius: 6px;
    "
  >

  <button
    type="button"
    id="updateLicenseFrontDeleteButton"
    class="image-delete-button"

function requestUpdatePassword(initialMessage = "") {

  return new Promise(function (resolve) {

    /* 前回の入力内容を消す */
    updatePasswordInput.value = "";

    /* 指定されたメッセージを表示 */
    updatePasswordMessage.textContent =
      initialMessage;

    /* ポップアップを開く */
    updatePasswordModal.classList.add("is-open");

    updatePasswordModal.setAttribute(
      "aria-hidden",
      "false"
    );

    /* パスワード欄にカーソルを移す */
    setTimeout(function () {

      updatePasswordInput.focus();

    }, 0);


    /* ポップアップを閉じる共通処理 */
    function closeUpdatePasswordModal() {

      updatePasswordModal.classList.remove("is-open");

      updatePasswordModal.setAttribute(
        "aria-hidden",
        "true"
      );

      updatePasswordInput.value = "";
      updatePasswordMessage.textContent = "";

      updatePasswordConfirmButton.onclick = null;
      updatePasswordCancelButton.onclick = null;
      updatePasswordInput.onkeydown = null;

    }


    /* 確認して更新 */
    function confirmUpdatePassword() {

      const password =
        updatePasswordInput.value.trim();

      if (!password) {

        updatePasswordMessage.textContent =
          "更新用パスワードを入力して下さい。";

        updatePasswordInput.focus();

        return;
      }

      closeUpdatePasswordModal();

      resolve(password);

    }


    /* キャンセル */
    updatePasswordCancelButton.onclick =
      function () {

        closeUpdatePasswordModal();

        resolve(null);

      };


    /* 確認して更新 */
    updatePasswordConfirmButton.onclick =
      function () {

        confirmUpdatePassword();

      };


    /* パスワード欄でEnterを押しても確認 */
    updatePasswordInput.onkeydown =
      function (event) {

        if (event.key === "Enter") {

          event.preventDefault();

          confirmUpdatePassword();

        }

        if (event.key === "Escape") {

          event.preventDefault();

          closeUpdatePasswordModal();

          resolve(null);

        }

      };

  });

}

/* 保安講習受講予定日の自動計算 */
/* ====================================== */

const safetyTrainingDate =
  document.getElementById("safetyTrainingDate");

const safetyTrainingScheduledDate =
  document.getElementById("safetyTrainingScheduledDate");


safetyTrainingDate.addEventListener("change", function () {

  if (!safetyTrainingDate.value) {

    safetyTrainingScheduledDate.value = "";
    safetyTrainingScheduledDate.dispatchEvent(
      new Event("change")
    );

    return;
  }


  const selectedDate =
    new Date(
      safetyTrainingDate.value + "T00:00:00"
    );

  const selectedYear =
    selectedDate.getFullYear();


  /* その年の3月31日 */
  const march31 =
    new Date(
      selectedYear,
      2,
      31
    );


  /* 受講日以降で直近の3月31日を求める */
  let baseYear;

  if (selectedDate <= march31) {

    baseYear =
      selectedYear;

  } else {

    baseYear =
      selectedYear + 1;

  }


  /* 直近の3月31日から3年後 */
  const scheduledYear =
    baseYear + 3;


  safetyTrainingScheduledDate.value =
    scheduledYear + "-03-31";


  /* 「カレンダーから選択」を消す */
  safetyTrainingScheduledDate.dispatchEvent(
    new Event("change")
  );

});

licenseRenewalUpdateButton.addEventListener("click", async function () {

  /* 写真有効期限 */
  const photoExpiryDate =
    document.getElementById("photoExpiryDate").value;


  /* 保安講習受講日 */
  const safetyTrainingDate =
    document.getElementById("safetyTrainingDate").value;


  /* 保安講習受講予定日 */
  const safetyTrainingScheduledDate =
    document.getElementById(

  /* 新しい危険物免状 表 */
  const licenseFrontImage =
    updateLicenseFrontFile.files[0] ||
    updateLicenseFrontCamera.files[0];


  /* 新しい危険物免状 裏 */
  const licenseBackImage =
    updateLicenseBackFile.files[0] ||
    updateLicenseBackCamera.files[0];


  licenseRenewalUpdateMessage.textContent = "";
  licenseRenewalUpdateMessage.className = "";


  /* ====================================== */
  /* 変更内容があるか確認 */
  /* ====================================== */

  if (
    !photoExpiryDate &&
    !safetyTrainingDate &&
    !licenseFrontImage &&
    !licenseBackImage
  ) {

    licenseRenewalUpdateMessage.textContent =
      "更新する項目を入力または選択して下さい。";

    licenseRenewalUpdateMessage.className =
      "error";

    return;

  }


  /* ====================================== */
  /* 更新用パスワードを入力 */
  /* ====================================== */

  const updatePassword =
    await requestUpdatePassword();


  /* キャンセルされた場合は更新しない */
  if (updatePassword === null) {

    return;

  }


  /* ====================================== */
  /* Power Automateへ送るデータを作成 */
  /* ====================================== */

  const requestBody = {

    employeeNo:
      document
        .getElementById("employeeNo")
        .value
        .trim(),

    updateType:
      "licenseRenewal",

    password:
      updatePassword

  };


  /* 写真有効期限 */
  if (photoExpiryDate) {

    requestBody.photoExpiryDate =
      photoExpiryDate;

  }


  /* 保安講習受講日 */
  if (safetyTrainingDate) {

    requestBody.safetyTrainingDate =
      safetyTrainingDate;

    requestBody.safetyTrainingScheduledDate =
      safetyTrainingScheduledDate;

  }


  /* ====================================== */
  /* 新しい表画像がある場合 */
  /* ====================================== */

  if (licenseFrontImage) {

    const licenseFrontBase64 =
      await fileToBase64(licenseFrontImage);

    requestBody.licenseFront =
      licenseFrontBase64;

    requestBody.licenseFrontName =
      licenseFrontImage.name;

  }


  /* ====================================== */
  /* 新しい裏画像がある場合 */
  /* ====================================== */

  if (licenseBackImage) {

    const licenseBackBase64 =
      await fileToBase64(licenseBackImage);

    requestBody.licenseBack =
      licenseBackBase64;

    requestBody.licenseBackName =
      licenseBackImage.name;

  }


  /* ====================================== */
  /* Power Automateへ送信 */
  /* ====================================== */

  licenseRenewalUpdateButton.disabled = true;

  licenseRenewalUpdateButton.textContent =
    "更新中です...";


  try {

    let response;
    let data;


    while (true) {

      response =
        await fetch(
          UPDATE_FLOW_URL,
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify(
              requestBody
            )
          }
        );


      /* ====================================== */
      /* 更新用パスワードが違う場合 */
      /* ====================================== */

      if (response.status === 401) {

        const newUpdatePassword =
          await requestUpdatePassword(
            "更新用パスワードが違います。"
          );


        /* 再入力時にキャンセルされた場合 */
        if (newUpdatePassword === null) {

          return;

        }


        /* 新しく入力したパスワードへ差し替える */
        requestBody.password =
          newUpdatePassword;


        /* 新しいパスワードで再送信する */
        continue;

      }


      /* ====================================== */
      /* 401以外のHTTPエラー */
      /* ====================================== */

      if (!response.ok) {

        throw new Error(
          "HTTP " + response.status
        );

      }


      data =
        await response.json();


      /* ====================================== */
      /* Power Automateの処理結果を確認 */
      /* ====================================== */

      if (data.success !== true) {

        throw new Error(
          "更新処理が正常終了しませんでした。"
        );

      }


      /* 更新成功のため、再送信処理を終了 */
      break;

    }


    /* ====================================== */
    /* 更新した値を現在値にも反映 */
    /* ====================================== */

    if (photoExpiryDate) {

      currentEmployeeData.photoExpiryDate =
        photoExpiryDate;

    }


    if (safetyTrainingDate) {

      currentEmployeeData.safetyTrainingDate =
        safetyTrainingDate;

      currentEmployeeData.safetyTrainingScheduledDate =
        safetyTrainingScheduledDate;

    }


    licenseRenewalUpdateMessage.textContent =
      "資格情報を更新しました。";

    licenseRenewalUpdateMessage.className =
      "success";


  } catch (error) {

    console.error(error);

    licenseRenewalUpdateMessage.textContent =
      "資格情報の更新に失敗しました。";

    licenseRenewalUpdateMessage.className =
      "error";


  } finally {

    licenseRenewalUpdateButton.disabled = false;

    licenseRenewalUpdateButton.textContent =
      "更新する";

  }

});

  /* 画像ファイルをBase64に変換 */
function fileToBase64(file) {

  return new Promise(function (resolve, reject) {

    const reader =
      new FileReader();

    reader.onload = function () {

      const base64 =
        reader.result
          .split(",")[1];

      resolve(base64);

    };

    reader.onerror = function () {

      reject(
        new Error("画像の読み込みに失敗しました。")
      );

    };

    reader.readAsDataURL(file);

  });

}
